<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      min-height: 100vh;
      color: #ffffff;
      background:
        linear-gradient(
          rgba(0, 0, 0, 0.68),
          rgba(0, 0, 0, 0.68)
        ),
        url("background.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      display: flex;
      flex-direction: column;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 1000;
      width: 100%;
      background: rgba(5, 5, 5, 0.9);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.35);
    }

    .logo {
      font-size: 21px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .nav {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .nav button {
      background: transparent;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      padding: 9px 14px;
      margin: 0;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      transition:
        background 0.2s ease,
        color 0.2s ease,
        transform 0.2s ease;
    }

    .nav button:hover {
      background: rgba(229, 36, 32, 0.15);
      color: #e52420;
      transform: translateY(-1px);
    }

    .content {
      flex: 1;
      width: 100%;
      padding: 30px;
      background: transparent;
    }

    .section {
      display: none;
      width: 100%;
      max-width: 1400px;
      margin: 0 auto;
    }

    .section.active {
      display: block;
    }

    h1 {
      margin-top: 0;
      margin-bottom: 20px;
      color: #ffffff;
      font-size: 28px;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
    }

    /* Rest of your styles omitted for brevity, include all your styles here */
    /* Make sure to copy the entire style block from your original code */
  </style>
</head>

<body style="background-image: url(image.png); background-size: cover; background-position: center; height: 100vh;">

  <header>
    <div class="logo">Portfolio</div>
    <div class="nav">
      <button onclick="showSection('home')">HOME</button>
      <button onclick="showSection('quiz')">QUIZ</button>
      <button onclick="showSection('laboratory')">LABORATORY</button>
      <button onclick="showSection('exam')">EXAM</button>
    </div>
  </header>

  <div class="content">
    <!-- Your sections: home, quiz, laboratory, exam -->
    <!-- Your existing HTML content here -->
  </div>

  <!-- Your script section -->
  <script>
    // Your entire JavaScript code from your snippet, placed here

    function showSection(sectionId) {
      document.querySelectorAll(".section").forEach(section => {
        section.classList.remove("active");
      });
      const selectedSection = document.getElementById(sectionId);
      if (selectedSection) {
        selectedSection.classList.add("active");
      }
    }

    function escapeHTML(value) {
      return value
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function showImage(input, preview) {
      const file = input.files[0];
      if (!file) return;
      const imageURL = URL.createObjectURL(file);
      preview.innerHTML = `<img src="${imageURL}" alt="Uploaded Image">`;
    }

    function showFile(input, preview, block) {
      const file = input.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        preview.innerHTML = `<a href="${reader.result}" download="${escapeHTML(file.name)}">${escapeHTML(file.name)}</a>`;
        if (block) saveCurrentBlock(block);
      };
      reader.readAsDataURL(file);
    }

    const HOME_STORAGE_KEY = "portfolio_home_data";

    async function getHomeData() {
      try {
        const result = await window.storage.get(HOME_STORAGE_KEY, false);
        if (!result) return null;
        return JSON.parse(result.value);
      } catch (error) {
        return null;
      }
    }

    async function saveHomeData(data) {
      try {
        await window.storage.set(HOME_STORAGE_KEY, JSON.stringify(data), false);
      } catch (error) {
        console.error("Storage error:", error);
      }
    }

    async function saveHomeImage(file) {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = async (e) => {
        const existingData = (await getHomeData()) || { name: "", section: "", details: "", image: "" };
        existingData.image = e.target.result;
        await saveHomeData(existingData);
      };
      reader.readAsDataURL(file);
    }

    document.getElementById("imageInput").addEventListener("change", () => {
      showImage(document.getElementById("imageInput"), document.getElementById("imagePreview"));
      saveHomeImage(document.getElementById("imageInput").files[0]);
    });

    async function showOutput() {
      const name = document.getElementById("nameInput").value.trim();
      const section = document.getElementById("sectionInput").value.trim();
      const details = document.getElementById("detailsInput").value.trim();
      if (!name) { alert("Please enter your name."); return; }

      const nameParts = name.split(/\s+/).filter(Boolean);
      const surname = nameParts.pop();
      const firstNames = nameParts.join(" ");
      const nameHTML = `
        ${escapeHTML(firstNames)}
        ${firstNames ? " " : ""}
        <span class="surname">${escapeHTML(surname)}</span>
      `;

      const currentHomeData = (await getHomeData()) || {};
      const outputHTML = `
        <h2>${nameHTML}</h2>
        <div class="output-line">
          <span class="output-label">Section:</span><span class="output-value">${escapeHTML(section)}</span>
        </div>
        <div class="output-line">
          <span class="output-label">Details:</span><span class="details-value">${escapeHTML(details)}</span>
        </div>
        <button class="output-action" onclick="removeHome()">Remove</button>
      `;

      await saveHomeData({ name, section, details, image: currentHomeData.image || "" });
      document.getElementById("outputArea").innerHTML = outputHTML;
      document.getElementById("formArea").style.display = "none";
      document.getElementById("outputArea").style.display = "block";
      document.getElementById("fileArea").style.display = "none";
    }

    function resetForm() {
      document.getElementById("nameInput").value = "";
      document.getElementById("sectionInput").value = "";
      document.getElementById("detailsInput").value = "";
      document.getElementById("imageInput").value = "";
      document.getElementById("imagePreview").innerHTML = "";
      document.getElementById("fileArea").style.display = "block";
      document.getElementById("formArea").style.display = "block";
      document.getElementById("outputArea").style.display = "none";
    }

    async function removeHome() {
      try {
        await window.storage.delete(HOME_STORAGE_KEY, false);
      } catch (error) {
        console.error("Storage error:", error);
      }
      // Reset form
      document.getElementById("nameInput").value = "";
      document.getElementById("sectionInput").value = "";
      document.getElementById("detailsInput").value = "";
      document.getElementById("imageInput").value = "";
      document.getElementById("imagePreview").innerHTML = "";
      document.getElementById("outputArea").innerHTML = "";
      document.getElementById("outputArea").style.display = "none";
      document.getElementById("formArea").style.display = "block";
      document.getElementById("fileArea").style.display = "block";
    }

    async function loadHomeData() {
      const data = await getHomeData();
      if (!data) return;
      document.getElementById("nameInput").value = data.name || "";
      document.getElementById("sectionInput").value = data.section || "";
      document.getElementById("detailsInput").value = data.details || "";
      if (data.image) {
        document.getElementById("imagePreview").innerHTML = `<img src="${data.image}" alt="Uploaded Image">`;
      }
      if (data.name) {
        const nameParts = data.name.split(/\s+/).filter(Boolean);
        const surname = nameParts.pop();
        const firstNames = nameParts.join(" ");
        const nameHTML = `
          ${escapeHTML(firstNames)}
          ${firstNames ? " " : ""}
          <span class="surname">${escapeHTML(surname)}</span>
        `;
        const outputHTML = `
          <h2>${nameHTML}</h2>
          <div class="output-line">
            <span class="output-label">Section:</span><span class="output-value">${escapeHTML(data.section || "")}</span>
          </div>
          <div class="output-line">
            <span class="output-label">Details:</span><span class="details-value">${escapeHTML(data.details || "")}</span>
          </div>
          <button class="output-action" onclick="removeHome()">Remove</button>
        `;
        document.getElementById("outputArea").innerHTML = outputHTML;
        document.getElementById("formArea").style.display = "none";
        document.getElementById("outputArea").style.display = "block";
        document.getElementById("fileArea").style.display = "none";
      }
    }

    // Bind input events for quiz, laboratory, exam blocks
    document.querySelectorAll(".quiz-block").forEach(function(block) {
      bindImageInput(block, ".quizImageInput", ".quizImagePreview");
      bindFileInput(block, ".quizFileInput", ".quizFilePreview");
    });
    document.querySelectorAll(".laboratory-block").forEach(function(block) {
      bindImageInput(block, ".laboratoryImageInput", ".laboratoryImagePreview");
      bindFileInput(block, ".laboratoryFileInput", ".laboratoryFilePreview");
    });
    document.querySelectorAll(".exam-block").forEach(function(block) {
      bindImageInput(block, ".examImageInput", ".examImagePreview");
      bindFileInput(block, ".examFileInput", ".examFilePreview");
    });

    // Load all data on window load
    window.addEventListener("load", async () => {
      await loadHomeData();
      await loadSavedBlocks("quiz");
      await loadSavedBlocks("laboratory");
      await loadSavedBlocks("exam");
    });
  </script>

</body>
</html>
